<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Учебный режим — Focus Guard</title>
  <style>
    body { background: #102a35; color: #f2f8f7; margin: 0; min-height: 100vh;
           font: 16px system-ui,sans-serif; display: grid; place-items: center; }
    main { max-width: 560px; margin: 20px; text-align: center; padding: 38px;
           border-radius: 18px; background: #193c49; }
    h1 { font-size: 30px; margin: 0 0 18px; }

    p { line-height: 1.6; }
  </style>

<body>
  <main>
    <h1>Сейчас время учёбы</h1>
    <p>YouTube временно закрыт. Ты сам выбрал время, чтобы сосредоточиться.</p>
    <div id="countdown">Проверяем таймер…</div>
    <p>Можно вернуться к математике, C++ или другому запланированному делу.</p>
  </main>
  <script src="blocked.js"></script>

</html>
