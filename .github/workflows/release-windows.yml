name: Build and release Windows exe

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/release-windows.yml
  workflow_dispatch:
    inputs:
      version:
        description: "New release tag (for example v0.2.0)"
        required: true
        default: v0.2.0

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run tests
        run: python -m unittest -v

      - name: Build standalone executable
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check "pyinstaller==6.22.3" "pystray==0.19.5" "Pillow>=10,<13"
          python -m PyInstaller --onefile --windowed --clean --hidden-import=pystray._win32 --name ActivityWatchFocusGuard focus_guard.py

      - name: Pack extension and write checksums
        shell: pwsh
        run: |
          $exe = "dist/ActivityWatchFocusGuard.exe"
          if (!(Test-Path $exe)) { throw "Executable is missing" }
          Compress-Archive -Path "browser-extension/*" -DestinationPath "dist/FocusGuardBrowserExtension.zip" -Force
          $names = @("ActivityWatchFocusGuard.exe", "FocusGuardBrowserExtension.zip")
          $lines = foreach ($name in $names) {
            $hash = (Get-FileHash "dist/$name" -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $name"
          }
          $lines | Out-File -FilePath "dist/SHA256SUMS.txt" -Encoding ascii

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.version || 'v0.2.0' }}
        run: |
          gh release create $env:RELEASE_TAG "dist/ActivityWatchFocusGuard.exe" "dist/FocusGuardBrowserExtension.zip" "dist/SHA256SUMS.txt" --target $env:GITHUB_SHA --title "Focus Guard $env:RELEASE_TAG" --notes-file RELEASE_NOTES.md
